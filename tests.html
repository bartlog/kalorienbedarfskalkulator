<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Kalorienbedarfsrechner — Tests</title>
  <style>
    body { font-family: monospace; padding: 1.5rem; background: #fff; color: #111; }
    .pass { color: #1a7a3a; }
    .fail { color: #b3261e; font-weight: bold; }
    li { margin-bottom: 0.25rem; }
    #summary { font-size: 1.1rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>Kalorienbedarfsrechner — In-Browser-Tests</h1>
  <p>Läuft ohne npm/Server — einfach diese Datei per Doppelklick im Browser öffnen.</p>
  <div id="summary"></div>
  <ul id="results"></ul>

  <script src="js/formeln.js"></script>
  <script src="js/auswahl.js"></script>
  <script src="js/modifikatoren.js"></script>
  <script src="js/berechnung.js"></script>
  <script>
    "use strict";
    const results = [];
    let currentGroup = "";

    function group(name) {
      currentGroup = name;
    }

    function assert(condition, message) {
      results.push({ pass: !!condition, message: `${currentGroup}: ${message}` });
    }

    function assertApprox(actual, expected, tolerance, message) {
      const diff = Math.abs(actual - expected);
      assert(diff <= tolerance, `${message} (erwartet ≈${expected}, erhalten ${actual.toFixed(1)}, Toleranz ±${tolerance})`);
    }

    const { berechne, GOAL_ADJUSTMENT } = window.KBR.berechnung;
    const { selectREE } = window.KBR.auswahl;
    const formeln = window.KBR.formeln;

    // ---- Formeln: Referenzwerte von Hand nachgerechnet -----------------
    group("Formeln (Referenzwerte)");
    assertApprox(
      formeln.mifflinStJeor({ gender: "male", age: 30, heightCm: 180, weightKg: 80 }),
      1780, 1,
      "Mifflin-St-Jeor Mann 30J/180cm/80kg: 10*80+6.25*180-5*30+5"
    );
    assertApprox(
      formeln.mifflinStJeor({ gender: "female", age: 28, heightCm: 165, weightKg: 65 }),
      1380, 1,
      "Mifflin-St-Jeor Frau 28J/165cm/65kg: 10*65+6.25*165-5*28-161"
    );
    assertApprox(formeln.cunningham({ ffmKg: 65 }), 370 + 21.6 * 65, 0.5, "Cunningham 1991: 370+21.6×FFM");
    assertApprox(formeln.tenHaaf({ ffmKg: 68 }), 22.771 * 68 + 484.264, 0.5, "Ten-Haaf FFM-basiert");
    assertApprox(formeln.luehrmann({ gender: "female", age: 68, weightKg: 68 }), 757 + 11.9 * 68 - 3.7 * 68 + 0, 0.5, "Lührmann Formel");
    assertApprox(formeln.ffmAusKfa({ weightKg: 80, kfaProzent: 20 }), 64, 0.01, "FFM aus KFA: 80×(1-0.20)");
    assert(
      Math.abs(formeln.cunningham({ ffmKg: 70 }) - (370 + 21.6 * 70)) < 0.001,
      "Katch-McArdle liefert identisches Ergebnis wie Cunningham (gleiche Funktion)"
    );

    // ---- Formelauswahl: Präzedenzbaum + Kollisionsfälle ----------------
    group("Formelauswahl (Präzedenzbaum)");
    assert(
      selectREE({ gender: "male", age: 30, heightCm: 180, weightKg: 80 }).formelId === "mifflin",
      "Standardfall -> Mifflin-St-Jeor"
    );
    assert(
      selectREE({ gender: "male", age: 25, heightCm: 182, weightKg: 78, ffmMeasured: true, ffmKg: 68, istSportler: true }).formelId === "tenhaaf",
      "FFM gemessen + Sportler 18-35 -> Ten-Haaf"
    );
    assert(
      selectREE({ gender: "male", age: 45, heightCm: 178, weightKg: 90, ffmMeasured: true, ffmKg: 65 }).formelId === "cunningham",
      "FFM gemessen, kein Sportler -> Cunningham"
    );
    assert(
      selectREE({ gender: "male", age: 70, heightCm: 175, weightKg: 75, ffmMeasured: true, ffmKg: 60, istSportler: true }).formelId === "cunningham",
      "Kollisionsfall: 70-jähriger Athlet mit FFM -> Cunningham (nicht Ten-Haaf, Alter außerhalb Validierung)"
    );
    assert(
      selectREE({ gender: "male", age: 72, heightCm: 172, weightKg: 105 }).formelId === "mueller",
      "Kollisionsfall: adipöser Senior -> Müller (nicht Lührmann)"
    );
    assert(
      selectREE({ gender: "female", age: 22, heightCm: 170, weightKg: 48 }).formelId === "mifflin",
      "Untergewicht (BMI<18.5) -> Mifflin (Müller-Untergewicht entfernt, siehe formeln.js)"
    );
    assert(
      selectREE({ gender: "female", age: 68, heightCm: 165, weightKg: 45 }).formelId === "luehrmann",
      "Untergewichtiger Senior -> Lührmann (fällt durch, da keine Müller-Untergewicht-Stufe mehr existiert)"
    );
    assert(
      selectREE({ gender: "female", age: 68, heightCm: 165, weightKg: 68 }).formelId === "luehrmann",
      "Senior ohne Extremgewicht -> Lührmann"
    );
    assert(
      selectREE({ gender: "female", age: 30, heightCm: 168, weightKg: 70, schwangerschaftStillzeit: "schwanger" }).formelId === "mifflin",
      "Schwangerschaft -> Mifflin"
    );
    assert(
      selectREE({ gender: "female", age: 30, heightCm: 168, weightKg: 70, schwangerschaftStillzeit: "schwanger" }).hinweise.length === 1,
      "Schwangerschaft erzeugt Validierungs-Hinweis"
    );

    // ---- Soft Boundaries (BMI 29-31, Alter 60-69) -----------------------
    // Beide Zonen sind unabhängig voneinander gestapelt (Option 2), keine
    // exklusive Vorrangregel mehr -- r.alternativen ist ein Array mit 0, 1
    // oder 2 Einträgen ({formelId, formelName, reeBasis, softBoundary}).
    group("Soft Boundaries (Formelvergleich, gestapelt)");
    (function () {
      // BMI 30,45 (>=30 -> Müller primär), innerhalb der Zone [29,31], Alter außerhalb
      const r = selectREE({ gender: "male", age: 40, heightCm: 170, weightKg: 88 });
      assert(r.formelId === "mueller", "BMI-Soft-Zone oberhalb 30 -> Müller bleibt primär");
      assert(r.alternativen.length === 1, "BMI-Soft-Zone oberhalb 30 -> genau eine Alternative");
      assert(r.alternativen[0].formelId === "mifflin" && r.alternativen[0].softBoundary === "bmi", "BMI-Soft-Zone oberhalb 30 -> Alternative ist Mifflin/bmi");
    })();
    (function () {
      // BMI 29,41 (<30 -> Mifflin primär), innerhalb der Zone [29,31], Alter außerhalb
      const r = selectREE({ gender: "male", age: 40, heightCm: 170, weightKg: 85 });
      assert(r.formelId === "mifflin", "BMI-Soft-Zone unterhalb 30 -> Mifflin bleibt primär");
      assert(r.alternativen.length === 1, "BMI-Soft-Zone unterhalb 30 -> genau eine Alternative");
      assert(r.alternativen[0].formelId === "mueller" && r.alternativen[0].softBoundary === "bmi", "BMI-Soft-Zone unterhalb 30 -> Alternative ist Müller/bmi");
    })();
    (function () {
      const rNormal = selectREE({ gender: "male", age: 40, heightCm: 180, weightKg: 75 }); // BMI ~23
      assert(rNormal.alternativen.length === 0, "Normalgewicht (BMI~23) -> keine Soft-Boundary-Alternative");
      const rAdipoes = selectREE({ gender: "male", age: 40, heightCm: 170, weightKg: 105 }); // BMI ~36
      assert(rAdipoes.alternativen.length === 0, "Deutliche Adipositas (BMI~36, außerhalb Zone) -> keine Alternative");
    })();
    (function () {
      // Alter 62 (<65 -> Mifflin primär), innerhalb der Zone [60,69], Normalgewicht
      const r = selectREE({ gender: "female", age: 62, heightCm: 165, weightKg: 62 });
      assert(r.formelId === "mifflin", "Alters-Soft-Zone unterhalb 65 -> Mifflin bleibt primär");
      assert(r.alternativen.length === 1, "Alters-Soft-Zone unterhalb 65 -> genau eine Alternative");
      assert(r.alternativen[0].formelId === "luehrmann" && r.alternativen[0].softBoundary === "alter", "Alters-Soft-Zone unterhalb 65 -> Alternative ist Lührmann/alter");
    })();
    (function () {
      // Alter 67 (>=65 -> Lührmann primär), innerhalb der Zone [60,69], Normalgewicht
      const r = selectREE({ gender: "female", age: 67, heightCm: 165, weightKg: 62 });
      assert(r.formelId === "luehrmann", "Alters-Soft-Zone oberhalb 65 -> Lührmann bleibt primär");
      assert(r.alternativen.length === 1, "Alters-Soft-Zone oberhalb 65 -> genau eine Alternative");
      assert(r.alternativen[0].formelId === "mifflin" && r.alternativen[0].softBoundary === "alter", "Alters-Soft-Zone oberhalb 65 -> Alternative ist Mifflin/alter");
    })();
    (function () {
      const rJung = selectREE({ gender: "female", age: 50, heightCm: 165, weightKg: 62 });
      assert(rJung.alternativen.length === 0, "Alter 50 (außerhalb Zone) -> keine Alternative");
      const rAlt = selectREE({ gender: "female", age: 75, heightCm: 165, weightKg: 62 });
      assert(rAlt.formelId === "luehrmann" && rAlt.alternativen.length === 0, "Alter 75 (>65, aber außerhalb Zone 60-69) -> keine Alternative");
    })();
    (function () {
      // Überlappung, beide primär außerhalb ihrer harten Schwelle: BMI 29,41
      // UND Alter 62 gleichzeitig in der jeweiligen Zone -> Mifflin bleibt
      // primär (weder bmi>=30 noch age>=65 greift), BEIDE Alternativen
      // erscheinen gestapelt statt sich exklusiv auszuschließen.
      const r = selectREE({ gender: "male", age: 62, heightCm: 170, weightKg: 85 });
      assert(r.formelId === "mifflin", "Überlappende Zonen -> Mifflin bleibt primär");
      assert(r.alternativen.length === 2, "Überlappende Zonen -> beide Alternativen gestapelt (nicht exklusiv)");
      const zonen = r.alternativen.map((a) => a.softBoundary).sort();
      assert(zonen[0] === "alter" && zonen[1] === "bmi", "Überlappende Zonen -> je ein bmi- und ein alter-Eintrag");
      const alt = r.alternativen.find((a) => a.softBoundary === "bmi");
      assert(alt.formelId === "mueller", "Überlappende Zonen -> BMI-Alternative ist weiterhin Müller");
      const altAlter = r.alternativen.find((a) => a.softBoundary === "alter");
      assert(altAlter.formelId === "luehrmann", "Überlappende Zonen -> Alter-Alternative ist Lührmann");
    })();
    (function () {
      // Testfall 6c: Alter genau 65 (harter Cutoff -> Lührmann bleibt primär,
      // wie bereits vor diesem Stacking-Umbau dokumentiert) UND BMI 29,75
      // (innerhalb der BMI-Zone [29,31]) gleichzeitig -> beide Zonen greifen
      // unabhängig voneinander: Alter-Zone vergleicht mit Mifflin (da Lührmann
      // selbst schon primär ist), BMI-Zone vergleicht mit Müller.
      const r = selectREE({ gender: "female", age: 65, heightCm: 165, weightKg: 81 });
      assertApprox(r.bmi, 29.75, 0.05, "Testfall 6c -> BMI wie erwartet ~29,75");
      assert(r.formelId === "luehrmann", "Testfall 6c -> Lührmann bleibt primär (harter Alters-Cutoff bei 65 unverändert)");
      assert(r.alternativen.length === 2, "Testfall 6c -> beide Zonen gestapelt");
      const mifflinAlt = r.alternativen.find((a) => a.softBoundary === "alter");
      const muellerAlt = r.alternativen.find((a) => a.softBoundary === "bmi");
      assert(mifflinAlt && mifflinAlt.formelId === "mifflin", "Testfall 6c -> Alter-Alternative ist Mifflin");
      assert(muellerAlt && muellerAlt.formelId === "mueller", "Testfall 6c -> BMI-Alternative ist Müller");
      // Exakte Werte gemäß den implementierten Formeln (nicht den zunächst vom
      // Nutzer überschlagenen Zahlen ~1.350/~1.355/~1.378 -- Gegenprobe von
      // Hand bestätigte 1480,4/1355,25/1420,4 als die tatsächlich korrekten
      // Formelergebnisse; die ursprüngliche Schätzung war ungenau, kein Bug).
      assertApprox(r.reeBasis, 1480.4, 1, "Testfall 6c -> Lührmann-Hauptwert 1.480 kcal");
      assertApprox(mifflinAlt.reeBasis, 1355.25, 1, "Testfall 6c -> Mifflin-Alternative 1.355 kcal");
      assertApprox(muellerAlt.reeBasis, 1420.4, 1, "Testfall 6c -> Müller-Alternative 1.420 kcal");
    })();

    // ---- Modifikatoren: Guards ------------------------------------------
    group("Modifikatoren-Guards");
    (function () {
      const kombi = window.KBR.modifikatoren.kombiniereReeFaktoren({
        adaptiveThermogenese: { faktorMin: 0.5, faktorMax: 0.5 }, // absichtlich extrem, um Clamp zu testen
      });
      assert(kombi.faktorMin >= 0.8 && kombi.faktorMax <= 1.4, "REE-Faktor-Kombination wird auf [0.80, 1.40] geklammert");
    })();
    (function () {
      const fieberOhne = window.KBR.modifikatoren.fieber({ koerpertemperaturC: 37 });
      assert(fieberOhne === null, "Fieber bei 37°C (kein Fieber) liefert null");
      const fieberMit = window.KBR.modifikatoren.fieber({ koerpertemperaturC: 39 });
      assert(fieberMit.faktorMin > 1 && fieberMit.faktorMax > fieberMit.faktorMin, "Fieber bei 39°C erhöht REE plausibel");
    })();

    // ---- Pipeline: Guards & Plausibilitätsgrenzen -----------------------
    group("Pipeline-Guards");
    (function () {
      // Adaptive Thermogenese zusätzlich aktiv, da die NEAT-Mindeststufe (unter5000)
      // im Mittel PAL 1.25 liefert (statt eines fixen 1.2 wie im alten Einzel-Dropdown)
      // -- ohne einen zusätzlichen REE-senkenden Faktor unterschreitet das 20%-Defizit
      // den Grundumsatz bei dieser PAL-Untergrenze nicht mehr zuverlässig.
      const r = berechne({
        gender: "female", age: 65, heightCm: 150, weightKg: 45,
        neatSchritteId: "unter5000", ziel: "lose", sport: { modus: "keine" },
        adaptiveThermogeneseAktiv: true,
      });
      assert(r.ziel.unterReeBasis === true, "Sehr niedriger TDEE + Abnehmen loest Warnhinweis 'unter REE_basis' aus");
      assertApprox(r.ziel.haupt, r.ree.basis, 0.01, "Ziel wird bei Unterschreitung auf den Grundumsatz gedeckelt (nicht blockiert)");
      assert(r.ziel.gewuenschtHaupt < r.ree.basis, "gewuenschtHaupt zeigt weiterhin den ungedeckelten (niedrigeren) Wunschwert für den Hinweistext");
      assert(r.ziel.bmiWarnung === false, "Normalgewicht (BMI~20) loest keine BMI-Warnung aus");
    })();
    (function () {
      // Untergewicht + Ziel Abnehmen -> eigenständige BMI-Warnung, unabhängig vom Grundumsatz-Clamp
      const r = berechne({
        gender: "female", age: 25, heightCm: 170, weightKg: 48,
        neatSchritteId: "5000bis10000", ziel: "lose", sport: { modus: "keine" },
      });
      assert(r.formel.bmi < 18.5, "Testfall hat tatsächlich Untergewicht (BMI < 18.5)");
      assert(r.ziel.bmiWarnung === true, "Untergewicht + Ziel Abnehmen loest BMI-Warnung aus");
    })();
    (function () {
      const r = berechne({
        gender: "male", age: 25, heightCm: 190, weightKg: 100,
        neatSchritteId: "ab15000", ziel: "gain",
        sport: { modus: "met", aktivitaeten: [{ metWert: 10, stundenProWoche: 7.5, label: "Laufen" }] },
      });
      assert(r.tee.haupt <= r.ree.basis * 2.5 + 0.01, "TEE bleibt innerhalb der globalen Plausibilitätsgrenze (<= 2.5x REE_basis)");
      assert(r.tee.haupt >= r.ree.basis * 1.0 - 0.01, "TEE bleibt innerhalb der globalen Plausibilitätsgrenze (>= 1.0x REE_basis)");
    })();
    (function () {
      // MET-Berechnung ersetzt die Aktivitätslevel-Schätzung, statt sie additiv zu ergänzen
      // (kein separater "PAL-Zuschlag" mehr -> kein Doppelzählungsrisiko mit dem ganzheitlichen PAL)
      const basis = { gender: "male", age: 30, heightCm: 178, weightKg: 75, neatSchritteId: "unter5000", ziel: "maintain" };
      const rKeine = berechne({ ...basis, sport: { modus: "keine" } });
      const rMet = berechne({ ...basis, sport: { modus: "met", aktivitaeten: [{ metWert: 9, stundenProWoche: 3, label: "Laufen" }] } });
      assert(rMet.tee.haupt > rKeine.tee.haupt, "MET-Berechnung erhöht TEE gegenüber 'keine'");
      assert(window.KBR.modifikatoren.sportPalZuschlag === undefined, "sportPalZuschlag wurde entfernt (kein additiver PAL-Zuschlag mehr)");

      // Mehrere Aktivitäten in einer Woche werden korrekt summiert
      const rZweiAktivitaeten = berechne({
        ...basis,
        sport: {
          modus: "met",
          aktivitaeten: [
            { metWert: 9, stundenProWoche: 3, label: "Laufen" },
            { metWert: 4, stundenProWoche: 2, label: "Tischtennis" },
          ],
        },
      });
      assert(
        rZweiAktivitaeten.tee.haupt > rMet.tee.haupt,
        "Mehrere MET-Aktivitäten summieren sich (zwei Aktivitäten > eine Aktivität)"
      );
    })();
    (function () {
      const r = berechne({
        gender: "male", age: 30, heightCm: 180, weightKg: 80,
        neatSchritteId: "5000bis10000", ziel: "maintain", sport: { modus: "keine" },
      });
      assert(r.fettabbau.haupt < r.tee.haupt, "Fettabbau-Kalorien liegen unter TEE");
      assert(r.fettabbau.haupt >= r.ree.basis, "Fettabbau-Kalorien nie unter REE_basis (Guard)");
      const deficit = r.tee.haupt - r.fettabbau.haupt;
      assert(deficit >= 249 && deficit <= 751, "Fettabbau-Defizit innerhalb der Sicherheitsgrenze [250,750] kcal (±1 Rundungstoleranz)");
    })();
    (function () {
      const r = berechne({
        gender: "male", age: 30, heightCm: 180, weightKg: 80,
        neatSchritteId: "5000bis10000", ziel: "maintain", sport: { modus: "keine" },
      });
      assertApprox(r.proteinErhalt.min, 80 * 1.2, 0.01, "Proteinbedarf Erhalt Untergrenze = Gewicht × 1.2");
      assertApprox(r.proteinAufbau.max, 80 * 2.0, 0.01, "Proteinbedarf Aufbau Obergrenze = Gewicht × 2.0");
    })();
    (function () {
      // BMI >=30 ohne FFM-Angabe -> weiterhin Gesamtgewicht als Referenz
      const rOhneFfm = berechne({
        gender: "male", age: 40, heightCm: 175, weightKg: 105,
        neatSchritteId: "unter5000", ziel: "maintain", sport: { modus: "keine" },
      });
      assert(rOhneFfm.proteinBasis === "gewicht", "BMI>=30 ohne FFM-Angabe: Proteinbasis bleibt Gesamtgewicht");
      assertApprox(rOhneFfm.proteinAufbau.max, 105 * 2.0, 0.01, "Proteinbedarf ohne FFM: Gesamtgewicht × 2.0");

      // BMI >=30 mit FFM (via KFA) -> FFM statt Gesamtgewicht als Referenz
      const ffmKg = formeln.ffmAusKfa({ weightKg: 105, kfaProzent: 35 }); // FFM = 68.25 kg
      const rMitFfm = berechne({
        gender: "male", age: 40, heightCm: 175, weightKg: 105, ffmKg,
        neatSchritteId: "unter5000", ziel: "maintain", sport: { modus: "keine" },
      });
      assert(rMitFfm.proteinBasis === "ffm", "BMI>=30 mit bekannter FFM: Proteinbasis wechselt auf FFM");
      assertApprox(rMitFfm.proteinAufbau.max, ffmKg * 2.0, 0.01, "Proteinbedarf mit FFM: FFM × 2.0 statt Gesamtgewicht × 2.0");
      assert(rMitFfm.proteinAufbau.max < rOhneFfm.proteinAufbau.max, "FFM-basierter Proteinbedarf liegt unter dem gesamtgewichtsbasierten Wert (verhindert Überschätzung)");
    })();

    // ---- NEAT/Sport-PAL-Trennung ----------------------------------------
    group("NEAT/Sport-PAL-Trennung");
    (function () {
      const m = window.KBR.modifikatoren;
      assertApprox(m.neatPalBereich({ neatSchritteId: "unter5000" }).palMin, 1.2, 0.001, "NEAT unter5000: palMin 1.2");
      assertApprox(m.neatPalBereich({ neatSchritteId: "unter5000" }).palMax, 1.3, 0.001, "NEAT unter5000: palMax 1.3");
      assertApprox(m.neatPalBereich({ neatSchritteId: "5000bis10000" }).palMin, 1.4, 0.001, "NEAT 5000bis10000: palMin 1.4");
      assertApprox(m.neatPalBereich({ neatSchritteId: "5000bis10000" }).palMax, 1.5, 0.001, "NEAT 5000bis10000: palMax 1.5");
      assertApprox(m.neatPalBereich({ neatSchritteId: "10000bis15000" }).palMin, 1.6, 0.001, "NEAT 10000bis15000: palMin 1.6");
      assertApprox(m.neatPalBereich({ neatSchritteId: "10000bis15000" }).palMax, 1.7, 0.001, "NEAT 10000bis15000: palMax 1.7");
      assertApprox(m.neatPalBereich({ neatSchritteId: "ab15000" }).palMin, 1.8, 0.001, "NEAT ab15000: palMin 1.8");
      assertApprox(m.neatPalBereich({ neatSchritteId: "ab15000" }).palMax, 2.0, 0.001, "NEAT ab15000: palMax 2.0");
      assert(m.neatPalBereich({ neatSchritteId: "unbekannt" }) === null, "NEAT unbekannte id liefert null");
    })();
    (function () {
      const m = window.KBR.modifikatoren;
      assertApprox(m.sportHaeufigkeitZuschlag({ haeufigkeitId: "keinSport" }).min, 0.0, 0.001, "Sport keinSport: +0.00");
      assertApprox(m.sportHaeufigkeitZuschlag({ haeufigkeitId: "1bis3" }).min, 0.1, 0.001, "Sport 1bis3: +0.10");
      assertApprox(m.sportHaeufigkeitZuschlag({ haeufigkeitId: "3bis5" }).min, 0.2, 0.001, "Sport 3bis5: +0.20");
      assertApprox(m.sportHaeufigkeitZuschlag({ haeufigkeitId: "6bis7" }).min, 0.3, 0.001, "Sport 6bis7: +0.30");
      assertApprox(m.sportHaeufigkeitZuschlag({ haeufigkeitId: "leistungssport" }).min, 0.4, 0.001, "Sport leistungssport: +0.40");
      assert(m.sportHaeufigkeitZuschlag({ haeufigkeitId: "unbekannt" }) === null, "Sport unbekannte id liefert null");
    })();
    (function () {
      const m = window.KBR.modifikatoren;
      assert(m.fidgetingPalZuschlag({ aktiv: false }) === null, "Fidgeting inaktiv liefert null");
      const f = m.fidgetingPalZuschlag({ aktiv: true });
      assertApprox(f.min, 0.05, 0.001, "Fidgeting aktiv: min +0.05");
      assertApprox(f.max, 0.1, 0.001, "Fidgeting aktiv: max +0.10");
    })();
    (function () {
      // Höhere NEAT-Stufe erhöht TEE bei sonst gleichem Input
      const basis = { gender: "male", age: 30, heightCm: 178, weightKg: 75, ziel: "maintain", sport: { modus: "keine", haeufigkeitId: "keinSport" } };
      const rNiedrig = berechne({ ...basis, neatSchritteId: "unter5000" });
      const rHoch = berechne({ ...basis, neatSchritteId: "ab15000" });
      assert(rHoch.tee.haupt > rNiedrig.tee.haupt, "Höhere NEAT-Stufe erhöht TEE");
    })();
    (function () {
      // MET-Modus ersetzt den Sport-Häufigkeits-Zuschlag, ignoriert haeufigkeitId
      const basis = { gender: "male", age: 30, heightCm: 178, weightKg: 75, neatSchritteId: "5000bis10000", ziel: "maintain" };
      const aktivitaeten = [{ metWert: 9, stundenProWoche: 3, label: "Laufen" }];
      const rLeistung = berechne({ ...basis, sport: { modus: "met", haeufigkeitId: "leistungssport", aktivitaeten } });
      const rKein = berechne({ ...basis, sport: { modus: "met", haeufigkeitId: "keinSport", aktivitaeten } });
      assertApprox(rLeistung.tee.haupt, rKein.tee.haupt, 0.01, "MET-Modus ignoriert sport.haeufigkeitId (Ersetzung, keine Ergänzung)");
    })();
    (function () {
      // Fidgeting addiert sich unabhängig vom Sport-Modus
      const basis = { gender: "male", age: 30, heightCm: 178, weightKg: 75, neatSchritteId: "5000bis10000", ziel: "maintain" };
      const rKeineOhne = berechne({ ...basis, sport: { modus: "keine", haeufigkeitId: "keinSport" }, fidgetingAktiv: false });
      const rKeineMit = berechne({ ...basis, sport: { modus: "keine", haeufigkeitId: "keinSport" }, fidgetingAktiv: true });
      assert(rKeineMit.tee.haupt > rKeineOhne.tee.haupt, "Fidgeting erhöht TEE im Sport-Modus 'keine'");
      const aktivitaeten = [{ metWert: 9, stundenProWoche: 3, label: "Laufen" }];
      const rMetOhne = berechne({ ...basis, sport: { modus: "met", aktivitaeten }, fidgetingAktiv: false });
      const rMetMit = berechne({ ...basis, sport: { modus: "met", aktivitaeten }, fidgetingAktiv: true });
      assert(rMetMit.tee.haupt > rMetOhne.tee.haupt, "Fidgeting erhöht TEE auch im Sport-Modus 'met'");
    })();
    (function () {
      // Extremfall über die Dropdowns: NEAT-Max 2.0 + Sport-Max 0.4 + Fidgeting-Max 0.1 = 2.5,
      // bleibt unter der neuen Klammer 2.6 (kein Abschneiden mehr, anders als bei der alten Grenze 2.4).
      const r = berechne({
        gender: "male", age: 25, heightCm: 180, weightKg: 80, neatSchritteId: "ab15000", ziel: "maintain",
        sport: { modus: "keine", haeufigkeitId: "leistungssport" }, fidgetingAktiv: true,
      });
      assertApprox(r.pal.max, 2.5, 0.01, "Extremfall über Dropdowns (NEAT max + Sport max + Fidgeting max) erreicht 2.5, ohne bei 2.4 gekappt zu werden");
    })();
    (function () {
      // Extremfall über MET: sehr hohes Trainingspensum kann den PAL-Hauptwert über 2.4 (Warnung)
      // und sogar über die neue Klammer 2.6 treiben -> Klammer greift korrekt.
      const r = berechne({
        gender: "male", age: 25, heightCm: 180, weightKg: 80, neatSchritteId: "ab15000", ziel: "maintain",
        sport: { modus: "met", aktivitaeten: [{ metWert: 20, stundenProWoche: 20, label: "Extrem" }] }, fidgetingAktiv: true,
      });
      assert(r.pal.hochWarnung === true, "Sehr hohes MET-Trainingspensum löst PAL-Hoch-Warnung aus (PAL >= 2.4)");
      assert(r.pal.max <= 2.6 + 0.001, "PAL-Hauptwert wird trotz extremem MET-Pensum auf 2.6 gekappt");
    })();
    (function () {
      const r = berechne({
        gender: "male", age: 30, heightCm: 178, weightKg: 75, neatSchritteId: "5000bis10000", ziel: "maintain",
        sport: { modus: "keine", haeufigkeitId: "keinSport" }, fidgetingAktiv: false,
      });
      assert(r.pal.hochWarnung === false, "Normalfall löst keine PAL-Hoch-Warnung aus");
    })();
    (function () {
      const basis = { gender: "male", age: 30, heightCm: 178, weightKg: 75, neatSchritteId: "5000bis10000", ziel: "maintain" };
      const rMitSport = berechne({ ...basis, sport: { modus: "keine", haeufigkeitId: "3bis5" }, fidgetingAktiv: true });
      const hatSportHaeufigkeit = rMitSport.aktiveModifikatoren.some((mod) => mod.id === "sport_haeufigkeit");
      const hatFidgeting = rMitSport.aktiveModifikatoren.some((mod) => mod.id === "fidgeting");
      assert(hatSportHaeufigkeit, "aktiveModifikatoren enthält 'sport_haeufigkeit' wenn Häufigkeit != keinSport");
      assert(hatFidgeting, "aktiveModifikatoren enthält 'fidgeting' wenn aktiv");

      const rOhne = berechne({ ...basis, sport: { modus: "keine", haeufigkeitId: "keinSport" }, fidgetingAktiv: false });
      const hatSportHaeufigkeitOhne = rOhne.aktiveModifikatoren.some((mod) => mod.id === "sport_haeufigkeit");
      const hatFidgetingOhne = rOhne.aktiveModifikatoren.some((mod) => mod.id === "fidgeting");
      assert(!hatSportHaeufigkeitOhne, "aktiveModifikatoren enthält 'sport_haeufigkeit' NICHT bei keinSport");
      assert(!hatFidgetingOhne, "aktiveModifikatoren enthält 'fidgeting' NICHT wenn inaktiv");

      const rMet = berechne({ ...basis, sport: { modus: "met", haeufigkeitId: "leistungssport", aktivitaeten: [{ metWert: 9, stundenProWoche: 3, label: "Laufen" }] } });
      const hatSportHaeufigkeitMet = rMet.aktiveModifikatoren.some((mod) => mod.id === "sport_haeufigkeit");
      assert(!hatSportHaeufigkeitMet, "aktiveModifikatoren enthält 'sport_haeufigkeit' NICHT im MET-Modus (auch bei gesetztem haeufigkeitId)");
    })();

    // ---- Lauf-Intensitätszuschlag + generische MET-Kategorie-Korrektur ----
    group("Lauf-Intensitätszuschlag");
    (function () {
      const m = window.KBR.modifikatoren;
      assertApprox(m.gehbasisPalAequivalent({ kmWoche: 14, weightKg: 70, reeAdj: 1750 }), 0.04, 0.0001, "Gehbasis: 14km/Woche, 70kg, reeAdj 1750 -> (14*70*0.5/7)/1750");
      assert(m.gehbasisPalAequivalent({ kmWoche: 0, weightKg: 70, reeAdj: 1750 }) === 0, "Gehbasis bei 0 km liefert 0");
      assertApprox(m.schritteZuKmWoche(10000), 7.5, 0.0001, "10.000 Schritte/Woche bei 0,75m Schrittlänge -> 7,5 km/Woche");
    })();
    (function () {
      const m = window.KBR.modifikatoren;
      assert(m.laufAnpassung({ aktiv: false, kmWoche: 30, weightKg: 80, reeAdj: 1800, vonMetAbgedeckt: false, traegtTracker: true }) === null, "Lauf inaktiv liefert null");
      assert(m.laufAnpassung({ aktiv: true, kmWoche: 0, weightKg: 80, reeAdj: 1800, vonMetAbgedeckt: false, traegtTracker: true }) === null, "Lauf aktiv mit 0 km liefert null");
      const z = m.laufAnpassung({ aktiv: true, kmWoche: 35, weightKg: 80, reeAdj: 1800, vonMetAbgedeckt: false, traegtTracker: true });
      // (35 * 80 * 1.0 / 7) / 1800 = 400 / 1800
      assertApprox(z.zuschlagMin, 400 / 1800, 0.0001, "Lauf-Zuschlag (volle Laufkosten): 35km/Woche, 80kg, reeAdj 1800 -> (35*80*1.0/7)/1800");
      assertApprox(z.zuschlagMax, z.zuschlagMin, 0.0001, "Lauf-Zuschlag ist ein Punktwert (min===max)");
      assertApprox(z.neatReduktion, 200 / 1800, 0.0001, "Gehbasis-Reduktion (0,5 kcal/kg/km) bei aktivem Tracker");

      const ohneTracker = m.laufAnpassung({ aktiv: true, kmWoche: 35, weightKg: 80, reeAdj: 1800, vonMetAbgedeckt: false, traegtTracker: false });
      assert(ohneTracker.neatReduktion === 0, "Ohne Tracker keine NEAT-Reduktion");
      assertApprox(ohneTracker.zuschlagMin, z.zuschlagMin, 0.0001, "Zuschlag bleibt trotzdem voll wirksam (Tracker-Schalter betrifft nur die Reduktion)");

      const vonMet = m.laufAnpassung({ aktiv: true, kmWoche: 35, weightKg: 80, reeAdj: 1800, vonMetAbgedeckt: true, traegtTracker: true });
      assertApprox(vonMet.zuschlagMin, 0, 0.0001, "MET-Abdeckung: kein zusätzlicher Zuschlag");
      assertApprox(vonMet.neatReduktion, z.neatReduktion, 0.0001, "MET-Abdeckung: NEAT-Reduktion bleibt trotzdem bestehen");
    })();
    (function () {
      const m = window.KBR.modifikatoren;
      const aktivitaeten = [
        { aktivitaetId: "joggen_locker", stundenProWoche: 3 },
        { aktivitaetId: "rad_moderat", stundenProWoche: 2 },
      ];
      const erwartetKm = (3 * 60 * 150 * m.SCHRITTLAENGE_M) / 1000; // nur joggen_locker (laufen), rad_moderat ist schrittneutral
      const erwartet = m.gehbasisPalAequivalent({ kmWoche: erwartetKm, weightKg: 75, reeAdj: 1800 });
      const ergebnis = m.schrittIntensiveMetKorrektur({ aktivitaeten, weightKg: 75, reeAdj: 1800, traegtTracker: true, laufAusschliessen: false });
      assertApprox(ergebnis, erwartet, 0.0001, "Laufen+Radfahren: nur Laufen (schritt-intensiv) trägt zur Korrektur bei");

      const nurSchrittneutral = m.schrittIntensiveMetKorrektur({
        aktivitaeten: [{ aktivitaetId: "kraft_intensiv", stundenProWoche: 4 }, { aktivitaetId: "schwimmen_locker", stundenProWoche: 2 }],
        weightKg: 75, reeAdj: 1800, traegtTracker: true, laufAusschliessen: false,
      });
      assert(nurSchrittneutral === 0, "Nur schrittneutrale Aktivitäten (Kraft, Schwimmen) -> keine Korrektur");

      const ohneTracker = m.schrittIntensiveMetKorrektur({ aktivitaeten, weightKg: 75, reeAdj: 1800, traegtTracker: false, laufAusschliessen: false });
      assert(ohneTracker === 0, "traegtTracker:false -> immer 0, unabhängig von den Aktivitäten");

      const mitAusschluss = m.schrittIntensiveMetKorrektur({
        aktivitaeten: [{ aktivitaetId: "joggen_locker", stundenProWoche: 3 }, { aktivitaetId: "fussball_locker", stundenProWoche: 2 }],
        weightKg: 75, reeAdj: 1800, traegtTracker: true, laufAusschliessen: true,
      });
      const nurFussball = m.schrittIntensiveMetKorrektur({
        aktivitaeten: [{ aktivitaetId: "fussball_locker", stundenProWoche: 2 }],
        weightKg: 75, reeAdj: 1800, traegtTracker: true, laufAusschliessen: false,
      });
      assertApprox(mitAusschluss, nurFussball, 0.0001, "laufAusschliessen:true blendet Laufen aus, Ballsport (Fußball) bleibt aber wirksam");
    })();
    (function () {
      // Plausibilitäts-Boden: NEAT-Mindeststufe + extrem hohe MET-Stunden für
      // eine Laufen-Aktivität darf keinen negativen/unplausiblen Zwischenwert
      // erzeugen -- weder im Endergebnis (globale Klammer) noch in der
      // Modifikator-Anzeige (Komponenten-Deckelung).
      const r = berechne({
        gender: "male", age: 30, heightCm: 180, weightKg: 70, neatSchritteId: "unter5000", ziel: "maintain",
        sport: { modus: "met", aktivitaeten: [{ aktivitaetId: "joggen_locker", metWert: 7.5, stundenProWoche: 40 }] },
        traegtTrackerBeimSport: true,
      });
      // Der Gesamt-TEE steigt bei 40h/Woche Joggen berechtigterweise stark an (der
      // reguläre MET-Zuschlag ist real und unabhängig vom NEAT-Reduktions-Boden) --
      // die globale Untergrenze 1,2 muss hier nicht erreicht werden, nur nie
      // unterschritten. Entscheidend ist, dass die NEAT-Reduktion selbst (nicht
      // der volle TEE) physikalisch plausibel begrenzt bleibt.
      assert(r.pal.min >= 1.2 - 0.001, "PAL-Untergrenze wird nie unterschritten");
      const korrektur = r.aktiveModifikatoren.find((mod) => mod.id === "met_neat_korrektur");
      assert(!korrektur || korrektur.zuschlag <= 1.2 + 0.001, "met_neat_korrektur bleibt physikalisch plausibel (nie größer als die NEAT-Stufen-Untergrenze)");
    })();
    (function () {
      // Fall A: Lauf-km oben + MET-Laufen unten -> MET übernimmt, kein
      // zusätzlicher lauf_intensitaet-Zuschlag.
      const basis = { gender: "male", age: 30, heightCm: 178, weightKg: 75, neatSchritteId: "5000bis10000", ziel: "maintain" };
      const aktivitaeten = [{ aktivitaetId: "joggen_locker", metWert: 7.5, stundenProWoche: 3 }];
      const rTracker = berechne({ ...basis, laufAktiv: true, laufKmWoche: 40, sport: { modus: "met", aktivitaeten }, traegtTrackerBeimSport: true });
      assert(rTracker.aktiveModifikatoren.some((m) => m.id === "lauf_via_met"), "Fall A: MET-Laufen vorhanden -> lauf_via_met statt lauf_intensitaet");
      assert(!rTracker.aktiveModifikatoren.some((m) => m.id === "lauf_intensitaet"), "Fall A: kein zusätzlicher lauf_intensitaet-Zuschlag wenn MET abdeckt");

      const rOhneTracker = berechne({ ...basis, laufAktiv: true, laufKmWoche: 40, sport: { modus: "met", aktivitaeten }, traegtTrackerBeimSport: false });
      assert(rOhneTracker.tee.haupt > rTracker.tee.haupt, "Fall A ohne Tracker: keine NEAT-Reduktion -> höherer TEE als mit Tracker");
    })();
    (function () {
      // Fall B: Lauf-km oben + andere (schrittneutrale) MET-Sportart unten ->
      // voller Lauf-Zuschlag bleibt, keine generische MET-Korrektur nötig.
      const basis = { gender: "male", age: 30, heightCm: 178, weightKg: 75, neatSchritteId: "5000bis10000", ziel: "maintain" };
      const aktivitaeten = [{ aktivitaetId: "kraft_intensiv", metWert: 5.0, stundenProWoche: 3 }];
      const r = berechne({ ...basis, laufAktiv: true, laufKmWoche: 40, sport: { modus: "met", aktivitaeten }, traegtTrackerBeimSport: true });
      assert(r.aktiveModifikatoren.some((m) => m.id === "lauf_intensitaet"), "Fall B: Lauf-km-Zuschlag bleibt voll bestehen, MET-Krafttraining deckt das Laufen nicht ab");
      assert(!r.aktiveModifikatoren.some((m) => m.id === "met_neat_korrektur"), "Fall B: Krafttraining ist schrittneutral, keine generische MET-Korrektur");
    })();
    (function () {
      // Fall C (Sonderfall): kein Lauf-km oben, aber MET-Laufen unten ->
      // generische Korrektur greift für die Laufen-Zeile.
      const basis = { gender: "male", age: 30, heightCm: 178, weightKg: 75, neatSchritteId: "5000bis10000", ziel: "maintain" };
      const aktivitaeten = [{ aktivitaetId: "joggen_locker", metWert: 7.5, stundenProWoche: 3 }];
      const rTracker = berechne({ ...basis, laufAktiv: false, laufKmWoche: 0, sport: { modus: "met", aktivitaeten }, traegtTrackerBeimSport: true });
      const rOhneTracker = berechne({ ...basis, laufAktiv: false, laufKmWoche: 0, sport: { modus: "met", aktivitaeten }, traegtTrackerBeimSport: false });
      assert(rTracker.aktiveModifikatoren.some((m) => m.id === "met_neat_korrektur"), "Fall C: MET-Laufen ohne Lauf-km löst generische NEAT-Korrektur aus");
      assert(!rOhneTracker.aktiveModifikatoren.some((m) => m.id === "met_neat_korrektur"), "Fall C ohne Tracker: keine Korrektur");
      assert(rOhneTracker.tee.haupt > rTracker.tee.haupt, "Fall C ohne Tracker: keine Reduktion -> höherer TEE als mit Tracker");
    })();
    (function () {
      const basis = { gender: "male", age: 30, heightCm: 178, weightKg: 75, neatSchritteId: "5000bis10000", ziel: "maintain", sport: { modus: "keine", haeufigkeitId: "keinSport" } };
      const rOhne = berechne({ ...basis, laufAktiv: false, laufKmWoche: 0 });
      const rMit = berechne({ ...basis, laufAktiv: true, laufKmWoche: 40 });
      assert(rMit.tee.haupt > rOhne.tee.haupt, "Aktivierter Lauf-Zuschlag erhöht TEE");
      const hatLauf = rMit.aktiveModifikatoren.some((mod) => mod.id === "lauf_intensitaet");
      const hatLaufOhne = rOhne.aktiveModifikatoren.some((mod) => mod.id === "lauf_intensitaet");
      assert(hatLauf, "aktiveModifikatoren enthält 'lauf_intensitaet' wenn aktiv mit km>0");
      assert(!hatLaufOhne, "aktiveModifikatoren enthält 'lauf_intensitaet' NICHT wenn inaktiv");
    })();

    // ---- Rendering ----
    const list = document.getElementById("results");
    let passCount = 0;
    for (const r of results) {
      const li = document.createElement("li");
      li.className = r.pass ? "pass" : "fail";
      li.textContent = (r.pass ? "✓ " : "✗ ") + r.message;
      list.appendChild(li);
      if (r.pass) passCount++;
    }
    const summary = document.getElementById("summary");
    const allPass = passCount === results.length;
    summary.textContent = `${passCount} / ${results.length} Tests bestanden`;
    summary.className = allPass ? "pass" : "fail";
  </script>
</body>
</html>
